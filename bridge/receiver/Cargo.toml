[package]
name = "crabgrab-bridge"
description = "Linux/WSL receiver for frames streamed by the CrabGrab bridge sender on Windows or macOS"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# std only - no dependencies, so it builds offline inside a fresh WSL distro

[lib]
path = "src/lib.rs"

[[bin]]
name = "crabgrab-recv"
path = "src/main.rs"

[[bin]]
name = "crabgrab-fake-sender"
path = "src/bin/fake_sender.rs"
